<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Demandas Contratuais</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
  body { background: #f4f7f6; min-height: 100vh; color: #333; } /* Fundo claro para o corpo */

  /* ===== AUTH (Mantido para simulação de login, mas não visível por padrão) ===== */
  .auth-wrap { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; background: #1a2a4a; }
  .auth-card { background: #fff; border-radius: 12px; padding: 40px; width: 100%; max-width: 420px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
  .auth-card h1 { color: #1a2a4a; font-size: 22px; font-weight: 700; margin-bottom: 4px; text-align: center; }
  .auth-card .subtitle { color: #666; font-size: 13px; text-align: center; margin-bottom: 28px; }
  .auth-card label { font-size: 13px; color: #444; font-weight: 600; display: block; margin-bottom: 4px; }
  .auth-card .field { margin-bottom: 16px; position: relative; }
  .auth-card input, .auth-card select, .auth-card textarea { width: 100%; padding: 10px 40px 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; outline: none; transition: border .2s; }
  .auth-card input:focus, .auth-card select:focus, .auth-card textarea:focus { border-color: #1a2a4a; }
  .auth-card input.input-erro { border-color: #c62828; background: #fff5f5; }
  .eye-btn { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: #888; font-size: 16px; }
  .btn-primary { width: 100%; padding: 11px; background: #1a2a4a; color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 4px; transition: background .2s; }
  .btn-primary:hover { background: #243d6a; }
  .btn-primary:disabled { background: #7a8fa6; cursor: not-allowed; }
  .auth-links { display: flex; justify-content: space-between; margin-top: 16px; }
  .auth-links a { color: #1a2a4a; font-size: 13px; text-decoration: none; cursor: pointer; }
  .auth-links a:hover { text-decoration: underline; }
  .auth-msg { margin-top: 12px; font-size: 13px; text-align: center; min-height: 18px; }
  .auth-msg.ok  { color: #2e7d32; }
  .auth-msg.err { color: #c62828; }

  .erro-box {
    display: none; background: #fce4ec; border: 1px solid #e57373;
    border-radius: 8px; padding: 10px 14px; margin-bottom: 14px;
    font-size: 13px; color: #c62828; text-align: center;
  }
  .erro-box.visivel { display: block; }

  /* ===== APP ===== */
  #appWrap { display: none; background: #f4f7f6; } /* Fundo claro para a aplicação */
  .topbar { background: #1a2a4a; color: #fff; display: flex; align-item..';
        document.getElementById('fDataEntrega').value = d.data_entrega || '';
        document.getElementById('fStatus').value = d.status || 'Em Produção';
        document.getElementById('fAprovada').value = d.aprovada || '';
        document.getElementById('fAprovador').value = d.aprovador || '';
        document.getElementById('fDataAprovacao').value = d.data_aprovacao || '';
        document.getElementById('fObservacoes').value = d.observacoes || '';
        document.getElementById('fRegistradoPor').value = d.registrado_por || (usuarioAtual ? usuarioAtual.nome : 'Desconhecido');
      }
    }
    document.getElementById('modalDemanda').classList.add('open');
  }

  function fecharModal() {
    document.getElementById('modalDemanda').classList.remove('open');
  }

  async function salvarDemanda() {
    let payload = {
      data_solicitacao: document.getElementById('fDataSolic').value || null,
      solicitante: document.getElementById('fSolicitante').value.trim() || null,
      area: document.getElementById('fArea').value.trim() || null,
      demanda: document.getElementById('fDemanda').value.trim() || null,
      descricao: document.getElementById('fDescricao').value.trim() || null,
      item_contrato: document.getElementById('fItemContrato').value.trim() || null,
      item_ppu: document.getElementById('fItemPPU').value.trim() || null,
      valor_ppu: parseFloat(document.getElementById('fValorPPU').value.replace(',', '.')) || 0.00,
      responsavel_principal: document.getElementById('fResponsavelPrincipal').value.trim() || null,
      equipe_envolvida: document.getElementById('fEquipeEnvolvida').value.trim() || null,
      complexidade: document.getElementById('fComplexidade').value || null,
      prazo_final_producao: document.getElementById('fPrazoFinalProducao').value || null,
      data_entrega: document.getElementById('fDataEntrega').value || null,
      status: document.getElementById('fStatus').value || 'Em Produção',
      aprovada: document.getElementById('fAprovada').value || null,
      aprovador: document.getElementById('fAprovador').value.trim() || null,
      data_aprovacao: document.getElementById('fDataAprovacao').value || null,
      observacoes: document.getElementById('fObservacoes').value.trim() || null,
      registrado_por: document.getElementById('fRegistradoPor').value.trim() || (usuarioAtual ? usuarioAtual.nome : 'Desconhecido')
    };

    // Preencher campos vazios com travessão para exibição na tabela
    // NOTA: Para campos de data, o travessão é aplicado na função formatDate ou calculateMedicao
    // Para valor_ppu, mantemos o 0.00 para cálculo e o travessão é aplicado na exibição na tabela
    for (const key in payload) {
      if (payload[key] === null || payload[key] === '') {
        // Não sobrescreve datas ou valor_ppu aqui, pois eles têm tratamento específico
        if (!['data_solicitacao', 'prazo_final_producao', 'data_entrega', 'data_aprovacao', 'valor_ppu'].includes(key)) {
          payload[key] = '-';
        }
      }
    }

    if (editandoId) {
      const index = dadosIniciaisDemandas.findIndex(d => d.id === editandoId);
      if (index !== -1) {
        dadosIniciaisDemandas[index] = { ...dadosIniciaisDemandas[index], ...payload };
      }
      await registrarLog('Edição de demanda', `Editou demanda: ${payload.demanda}`);
    } else {
      const newId = String(Math.max(...dadosIniciaisDemandas.map(d => Number(d.id))) + 1);
      payload.id = newId;
      dadosIniciaisDemandas.push(payload);
      await registrarLog('Nova demanda', `Criou demanda: ${payload.demanda}`);
    }

    fecharModal();
    carregarDemandas(); // Recarrega a lista para refletir as mudanças
  }

  async function excluirDemanda(id) {
    if (!confirm('Excluir esta demanda?')) return;
    const d = dadosIniciaisDemandas.find(x => x.id === id);
    dadosIniciaisDemandas = dadosIniciaisDemandas.filter(dem => dem.id !== id); // Remove do array local
    await registrarLog('Exclusão de demanda', `Excluiu demanda: ${d?.demanda || id}`);
    carregarDemandas(); // Recarrega a lista para refletir as mudanças
  }

  function editarDemanda(id) { abrirModal(id); }

  // ===== FUNÇÕES DE LOG (simuladas) =====
  async function registrarLog(acao, detalhe) {
    console.log(`LOG: ${acao} - ${detalhe}`);
  }

  // Fechar modais clicando fora
  document.getElementById('modalDemanda').addEventListener('click', function (e) {
    if (e.target === this) fecharModal();
  });

  // Inicia o carregamento das demandas ao carregar a página (após um login simulado)
  document.addEventListener('DOMContentLoaded', () => {
    // Simula um login para exibir a aplicação
    usuarioAtual = { id: 'user123', nome: 'Usuário Teste', email: 'teste@teste.com', perfil: 'master' };
    document.getElementById('authWrap').style.display = 'none';
    document.getElementById('appWrap').style.display = 'block';
    document.getElementById('topNome').textContent = usuarioAtual.nome;
    document.getElementById('topPerfil').textContent = `(${usuarioAtual.perfil})`;
    carregarDemandas();
  });
</script>
</body>
</html>
